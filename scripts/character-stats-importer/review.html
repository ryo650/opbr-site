<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="review-token" content="__TOKEN__"><title>Character Stats Importer</title><link rel="stylesheet" href="/review.css"><script defer src="/review.js"></script></head>
<body><main><header><p class="eyebrow">OPBR GUIDE · LOCAL IMPORTER v0.1</p><h1>最大ステータスの取り込み</h1><p>画像をまとめて読み取り、キャラクター・数値・条件を確認した行だけ保存します。</p></header>
<section class="toolbar"><label class="upload">画像を選ぶ（複数可）<input id="files" type="file" multiple accept="image/png,image/jpeg"></label><button id="save-selected">確認済みの選択行を保存</button><button id="reload">保存済みデータを再読み込み</button><span id="counts"></span></section>
<p class="note">保存するのはゲーム画面の表示値です。基礎ステータスへの変換は行いません。空欄は未取得として扱い、既存値を消しません。メダル未装備は画像で確認してください。</p>
<p id="message" role="status" aria-live="polite"></p><div id="rows"></div><p id="empty">PNG/JPEGの「Stats of max level」画面を選択してください。</p>
</main></body></html>
