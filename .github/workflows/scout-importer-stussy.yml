name: Scout Importer — Stussy reviewed-rate replay

on:
  pull_request:
    paths:
      - ".github/workflows/scout-importer-stussy.yml"
      - "scripts/scout-importer/**"
      - "src/data/scouts/**"
      - "src/data/characters/**"
      - "tests/egghead-stussy-normal.test.cjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run scouts:verify-stussy
      - run: npm run scouts:test
      - run: node --require ./tests/register.cjs --test tests/egghead-stussy-normal.test.cjs
      - run: npm test
      - run: npx tsc --noEmit
