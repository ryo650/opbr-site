name: Scout Step-Up Regression

on:
  pull_request:
    paths:
      - ".github/workflows/scout-step-up-regression.yml"
      - "src/data/scouts/**"
      - "src/lib/scout-step-up.ts"
      - "src/components/scout-step-up/**"
      - "src/data/characters/**"
      - "src/app/(mainPages)/scout-simulator/**"
      - "tests/scout-step-up.test.cjs"
      - "tests/egghead-stussy-step-up.test.cjs"

permissions:
  contents: read

jobs:
  step-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Step-Up and Stussy regression tests
        run: node --require ./tests/register.cjs --test tests/scout-step-up.test.cjs tests/egghead-stussy-step-up.test.cjs
