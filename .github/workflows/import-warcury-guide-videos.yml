name: Import Warcury Guide Videos
on:
  push:
    branches:
      - feat/warcury-pre-release-character-guide-20261020
    paths:
      - warcury-guide-videos.zip

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'ryo650/opbr-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify archive, import videos, and connect guide
        shell: bash
        run: |
          set -euo pipefail
          echo 'de39639f226e82ca018f560b8aba5b0c3bb1ad73f330e2df569ed8438ce6ad5e  warcury-guide-videos.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import shutil
          archive = Path('warcury-guide-videos.zip')
          folder = Path('public/character-guides/the-five-elders-st-topman-warcury')
          target_files = {
              'skill-1.mp4',
              'skill-2.mp4',
              'normal-attacks.mp4',
              'held-normal-attack.mp4',
          }
          with zipfile.ZipFile(archive) as z:
              if len(z.infolist()) != 4 or set(z.namelist()) != target_files:
                  raise ValueError('Archive must contain exactly the four expected MP4s')
              folder.mkdir(parents=True, exist_ok=True)
              for item in z.infolist():
                  if not 0 < item.file_size < 10_000_000:
                      raise ValueError('Unexpected video size')
                  name = item.filename
                  with z.open(name) as src:
                      data = src.read()
                  if data[4:8] != b'ftyp':
                      raise ValueError(f'Not an MP4: {name}')
                  (folder / name).write_bytes(data)

          path = Path('src/data/character-guides/the-five-elders-st-topman-warcury.ts')
          text = path.read_text(encoding='utf-8')
          prefix = '/character-guides/the-five-elders-st-topman-warcury/'
          replacements = [
              ('"label": "Normal Attack Combo",',
               '"label": "Normal Attack Combo",\n      "video": "' + prefix + 'normal-attacks.mp4",'),
              ('"label": "Hold Normal Attack: Treasure Response",',
               '"label": "Hold Normal Attack: Treasure Response",\n      "video": "' + prefix + 'held-normal-attack.mp4",'),
              ('"name": "I Will Chop You Up!",\n          "cooldown": 27,',
               '"name": "I Will Chop You Up!",\n          "cooldown": 27,\n          "video": "' + prefix + 'skill-1.mp4",'),
              ('"name": "Godhead of Justice' + "'" + 's Onrush",\n          "cooldown": 29,',
               '"name": "Godhead of Justice' + "'" + 's Onrush",\n          "cooldown": 29,\n          "video": "' + prefix + 'skill-2.mp4",'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise ValueError(f'Guide insertion point missing or duplicated: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          for name in target_files:
              assert (folder / name).is_file()
          print('Verified, imported, and linked all four Warcury videos')
          PY
      - name: Commit imported video assets to Draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/character-guides/the-five-elders-st-topman-warcury.ts public/character-guides/the-five-elders-st-topman-warcury/
          git rm -f warcury-guide-videos.zip
          git diff --cached --check
          git commit -m "feat: attach four verified Warcury guide videos"
          git push origin HEAD:feat/warcury-pre-release-character-guide-20261020
