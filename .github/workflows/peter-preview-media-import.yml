name: Import Peter preview media (one-time)
on:
  push:
    branches:
      - feat/peter-pre-release-guide-preview-20261020
    paths:
      - peter-preview-media-completion-kit.zip

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import approved media and update existing guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("peter-preview-media-completion-kit.zip")
          if not archive.is_file():
              raise SystemExit(0)
          source = "peter-full-media-review/media/"
          prefix = "/character-guides/the-five-elders-st-shepherd-ju-peter/"
          target = Path("public/character-guides/the-five-elders-st-shepherd-ju-peter")
          portrait = Path("public/characters/black/the-five-elders-st-shepherd-ju-peter.webp")
          destinations = {
              "peter.webp": portrait,
              **{n: target/n for n in ("skill-1.mp4","skill-2.mp4","sp-capture.mp4","capture-hp-50.mp4")}
          }

          with ZipFile(archive) as z:
              for filename, output in destinations.items():
                  data = z.read(source + filename)
                  if not data or len(data) > 25_000_000:
                      raise ValueError("Invalid media length: " + filename)
                  if filename.endswith(".webp") and not (data[:4] == b"RIFF" and data[8:12] == b"WEBP"):
                      raise ValueError("Invalid WebP: " + filename)
                  if filename.endswith(".mp4") and b"ftyp" not in data[:16]:
                      raise ValueError("Invalid MP4: " + filename)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(data)

          cpath = Path("src/data/characters/black.ts")
          characters = cpath.read_text()
          before = "/characters/black/the-five-elders-st-shepherd-ju-peter.svg"
          after = "/characters/black/the-five-elders-st-shepherd-ju-peter.webp"
          if before not in characters and after not in characters:
              raise ValueError("Peter character record missing")
          cpath.write_text(characters.replace(before, after))

          gpath = Path("src/data/character-guides/the-five-elders-st-shepherd-ju-peter.ts")
          guide = gpath.read_text()
          fields = (
              ('"title": "Match-Winning Capture Pressure",', "sp-capture.mp4"),
              ('"title": "Keep HP Above 50%",', "capture-hp-50.mp4"),
              ('"name": "None of You Are Leaving Alive!",', "skill-1.mp4"),
              ('"name": "Godhead of Agriculture\'s Raid",', "skill-2.mp4"),
          )
          for anchor, name in fields:
              if guide.count(anchor) != 1:
                  raise ValueError("Expected one target: " + anchor)
              reference = '"video": "' + prefix + name + '"'
              if reference not in guide:
                  guide = guide.replace(anchor, anchor + "\n      " + reference + ",")
          guide = guide.replace(
              "Pre-Release Guide — Media Integration Pending",
              "Pre-Release Guide"
          ).replace(
              "Early guide based on official pre-release reveals. Matchup ratings are predictions, not post-launch results. Temporary portrait and skill-video uploads are pending before final preview approval.",
              "Based on official pre-release reveals. Matchup ratings are predictions and will be reviewed after the October 21, 2026 release."
          )
          gpath.write_text(guide)
          Path("public/characters/black/the-five-elders-st-shepherd-ju-peter.svg").unlink(missing_ok=True)
          archive.unlink()
          print("Imported 1 WebP and 4 MP4s into PR branch.")
          PY
      - name: Commit into the same PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: attach Peter portrait and four gameplay clips"
            git push origin HEAD:feat/peter-pre-release-guide-preview-20261020
          fi
